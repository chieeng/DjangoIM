{% extends 'base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Delete Booking Report</h4>
            <a href="{% url 'reports:index' %}" class="btn btn-outline-secondary">Back</a>
        </div>
        <div class="card-body">
            <p>Are you sure you want to delete the report for <strong>{{ report.report_date|date:'M d, Y' }}</strong> (ID {{ report.id }})?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, delete</button>
                <a href="{% url 'reports:index' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
