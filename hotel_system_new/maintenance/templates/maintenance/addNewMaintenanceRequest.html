<!DOCTYPE html>
<html>
<head>
    <title>Add Maintenance Request</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        h1 { color: #333; }
        form { max-width: 500px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #218838; }
        a { color: #007bff; text-decoration: none; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>Add New Maintenance Request</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'maintenance:index' %}">Cancel</a>
    </form>
</body>
</html>
